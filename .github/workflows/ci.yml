name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

  android-artifacts:
    name: Build Android (dev + production)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core (mobile consumes its dist/ output, not live source)
        run: pnpm --filter @nalvie/core build

      - name: Generate the native Android project
        run: pnpm --filter @nalvie/mobile exec expo prebuild --platform android --no-install

      # TODO: Keystore will need to be configured
      - name: Assemble debug (dev) and release (production) APKs
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload dev APK
        uses: actions/upload-artifact@v7
        with:
          name: nalvie-dev
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload production APK
        uses: actions/upload-artifact@v7
        with:
          name: nalvie-production
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

