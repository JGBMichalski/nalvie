apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'expo-module-gradle-plugin'

android {
  namespace "expo.modules.screenlocksignal"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // MediaSessionCompat + NotificationCompat.MediaStyle. The session countdown
  // is posted as a media notification so it lands on the lock screen's media
  // card, which is rendered regardless of notification ranking — a plain
  // notification gets collapsed into the icon row on Android 16+ and can't be
  // read at a glance.
  implementation 'androidx.media:media:1.7.0'
}
